title: "文档中心"
show_title: false
permalink: /docs/

<div class="docs-page">
  <header class="docs-header">
    <h1 class="docs-title">📚 文档中心</h1>
    <p class="docs-subtitle">技术文档阅览，数据来源于独立知识仓库 <code>stan-fuls/knowledge-docs</code></p>
  </header>

  <!-- 搜索栏 + 按时间过滤 -->
  <div class="docs-toolbar">
    <div class="docs-search">
      <input type="text" id="docs-search-input" placeholder="🔍 搜索文档..." autocomplete="off">
    </div>
    <div class="docs-time-filter">
      <select id="docs-time-range">
        <option value="all">全部时间</option>
        <option value="6months">最近半年</option>
        <option value="3months">最近三个月</option>
        <option value="1month">最近一个月</option>
      </select>
    </div>
  </div>

  <!-- 加载状态 -->
  <div id="docs-loading" class="docs-loading">
    <div class="loading-spinner"></div>
    <p>正在从 <code>stan-fuls/knowledge-docs</code> 加载文档...</p>
  </div>

  <!-- 错误提示 -->
  <div id="docs-error" class="docs-error" style="display:none;">
    <p>⚠️ 无法加载文档列表，请确认：</p>
    <ol>
      <li>已创建 <a href="https://github.com/stan-fuls/knowledge-docs" target="_blank" rel="noopener">stan-fuls/knowledge-docs</a> 仓库</li>
      <li>仓库中包含 <code>.md</code> 格式的文档</li>
      <li>GitHub API 未超限（匿名调用 60次/小时）</li>
    </ol>
  </div>

  <!-- 按时间段分组的文档列表 -->
  <div id="docs-container" class="docs-container" style="display:none;">
    <!-- 由 docs.js 动态渲染 -->
  </div>
</div>

<script src="{{ '/assets/js/docs.js' | relative_url }}"></script>
