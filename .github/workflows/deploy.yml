name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # 扫描本地 docs/knowledge-docs/ + _posts/ 生成文档索引
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate docs index from local knowledge-docs
        run: node scripts/gen-docs-index.js

      # 提交脚本对 frontmatter 的修复,确保下次构建时文件已包含 frontmatter
      - name: Commit auto-injected frontmatter
        run: |
          git config user.email "[email protected]"
          git config user.name "docs-index-bot"
          if [ -n "$(git status --porcelain -- docs/knowledge-docs/)" ]; then
            echo "📝 检测到 docs/knowledge-docs/ 下有自动注入的 frontmatter,提交..."
            git add docs/knowledge-docs/
            git commit -m "ci: 自动为无 frontmatter 的文档注入最小配置" || true
            git push origin HEAD:master
          else
            echo "✅ 无需提交,所有文档已有 frontmatter"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Jekyll 构建
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site --trace 2>&1 | tee /tmp/jekyll-build.log

      # Pages 部署
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
