# ===========================================
# Share of Stam - Knowledge Sharing Hub
# ===========================================

# --- Site Settings ---
title: Share of Stam
description: Share Of Daily! Life, Work and Other
text_skin: default
highlight_theme: default
url: "https://stan-fuls.github.io"
baseurl: ""
timezone: Asia/Shanghai
repository: stan-fuls/stan-fuls.github.io
branch: master

# --- Author Info ---
author:
  type: person
  name: Stam
  bio: 技术分享与知识沉淀，记录生活、工作与学习中的点滴。
  email: HJworkspace@163.com
  github: stan-fuls

# --- Content ---
paginate: 8
paginate_path: /page:num
excerpt_separator: "<!--more-->"
license: CC-BY-NC-4.0
toc:
  selectors: "h1,h2,h3"

# --- Features ---
mathjax: true
mathjax_autoNumber: true
mermaid: true
chart: true

# Share (disabled)
sharing:
  provider: false

# Comments (disabled)
comments:
  provider: false

# Page view (disabled)
pageview:
  provider: false

# Search (default built-in)
search:
  provider: default

# Analytics (disabled)
analytics:
  provider: false

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

# --- Markdown ---
markdown: kramdown
highlighter: rouge
permalink: date

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Stam
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
    values:
      layout: article

# --- Exclude ---
exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - README-zh.md
  - node_modules
  - vendor
  - /test
  - /tools
  - /screenshots
  - /docker

# ===========================================
# Document Management System (NEW FEATURE)
# ===========================================
# Store documents in a separate GitHub repo.
# This repo serves as the web frontend & API gateway.
#
docs_repo:
  # GitHub username/org that owns the doc repo
  owner: stan-fuls
  # Repository name for document storage
  repo: obsidian-knowledge-docs
  # Branch to fetch documents from
  branch: main
  # Root directory in the doc repo where markdown files are stored
  base_path: ""
  # GitHub Personal Access Token (必需! 私有库没有 Token 无法拉取)
  # 在 https://github.com/settings/tokens 创建,权限只需 repo scope
  # ⚠️ 由于 GitHub Pages 是公开的,部署即对外暴露此 Token
  #    请使用 Fine-grained token 并仅授权此单个仓库访问
  token: ""

# Docs page settings
docs_settings:
  # Page title
  title: "文档中心"
  # Items per page
  per_page: 12
  # Enable search
  search: true
  # Enable category filter
  categories: true
  # Enable tag filter
  tags: true
