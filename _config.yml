# ===========================================
# Workspace of He Jie - Knowledge Sharing Hub
# ===========================================

# --- Site Settings ---
title: Workspace of He Jie
description: Share Of Daily! Life, Work and Other
text_skin: default
highlight_theme: default
url: "https://stan-fuls.github.io"
baseurl: ""
timezone: Asia/Shanghai
repository: stan-fuls/stan-fuls.github.io
branch: master

# --- Author Info ---
author:
  type: person
  name: hejie
  bio: I am an amazing person.
  email: HJworkspace@163.com
  github: stan-fuls
  avatar: /assets/images/avatar.png

# --- Content ---
paginate: 8
paginate_path: /page:num
excerpt_separator: "<!--more-->"
license: CC-BY-NC-4.0
toc:
  selectors: "h1,h2,h3"

# --- Features ---
mathjax: true
mathjax_autoNumber: true
mermaid: true
chart: true

# Share (disabled)
sharing:
  provider: false

# Comments (disabled)
comments:
  provider: false

# Page view (disabled)
pageview:
  provider: false

# Search (default built-in)
search:
  provider: default

# Analytics (disabled)
analytics:
  provider: false

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

# --- Markdown ---
markdown: kramdown
highlighter: rouge
permalink: date

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: hejie
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
    values:
      layout: article

# --- Exclude ---
exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - README-zh.md
  - node_modules
  - vendor
  - /docs
  - /test
  - /tools
  - /screenshots
  - /docker

# ===========================================
# Document Management System (NEW FEATURE)
# ===========================================
# Store documents in a separate GitHub repo.
# This repo serves as the web frontend & API gateway.
#
docs_repo:
  # GitHub username/org that owns the doc repo
  owner: stan-fuls
  # Repository name for document storage
  repo: knowledge-docs
  # Branch to fetch documents from
  branch: main
  # Root directory in the doc repo where markdown files are stored
  base_path: ""
  # GitHub API token (optional, for higher rate limits)
  # Set this via environment variable GITHUB_TOKEN instead of hardcoding
  # token: ""

# Docs page settings
docs_settings:
  # Page title
  title: "文档中心"
  # Items per page
  per_page: 12
  # Enable search
  search: true
  # Enable category filter
  categories: true
  # Enable tag filter
  tags: true
