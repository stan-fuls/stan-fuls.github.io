# ===========================================
# Share of Stam - Knowledge Sharing Hub
# ===========================================

# --- Site Settings ---
title: Share of Stam
description: Share Of Daily! Life, Work and Other
text_skin: default
highlight_theme: default
url: "https://stan-fuls.github.io"
baseurl: ""
timezone: Asia/Shanghai
repository: stan-fuls/stan-fuls.github.io
branch: master

# --- Author Info ---
author:
  type: person
  name: Stam
  bio: 技术分享与知识沉淀，记录生活、工作与学习中的点滴。
  email: HJworkspace@163.com
  github: stan-fuls

# --- Content ---
paginate: 8
paginate_path: /page:num
excerpt_separator: "<!--more-->"
license: CC-BY-NC-4.0
toc:
  selectors: "h1,h2,h3"

# --- Features ---
mathjax: true
mathjax_autoNumber: true
mermaid: true
chart: true

# Share (disabled)
sharing:
  provider: false

# Comments — Giscus (基于 GitHub Discussions)
# 使用前请执行以下步骤:
#   1. 在仓库 Settings → General → Features 中勾选 Discussions
#   2. 访问 https://github.com/apps/giscus 安装 Giscus App
#   3. 访问 https://giscus.app/zh-CN 填写仓库名,获取 repo_id / category / category_id
comments:
  provider: giscus
  giscus:
    repo: stan-fuls/stan-fuls.github.io
    repo_id: "R_kgDOG-8HXg"
    category: "Announcements"
    category_id: "DIC_kwDOG-8HXs4DDH-R"
    mapping: pathname
    reactions_enabled: "1"
    theme: preferred_color_scheme
    lang: zh-CN
    input_position: bottom

# Page view (disabled)
pageview:
  provider: false

# Search (default built-in)
search:
  provider: default

# Analytics (disabled)
analytics:
  provider: false

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

# --- Markdown ---
markdown: kramdown
highlighter: rouge
permalink: date

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Stam
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "docs/knowledge-docs"   # 知识库文档默认使用 doc 布局
    values:
      layout: doc

# --- Exclude ---
exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - README-zh.md
  - node_modules
  - vendor
  - /test
  - /tools
  - /screenshots
  - /docker
  - /docs/_templates        # Obsidian 文档模板,只作下载用途不渲染
  - preview-docs.html       # 本地预览页
  - preview.html            # 本地预览页

# ===========================================
# 文档中心 (knowledge-docs 位于本仓库内)
# ===========================================
# 文档存放在 docs/knowledge-docs/ 目录下,
# 构建时由 scripts/gen-docs-index.js 扫描生成索引。

docs_settings:
  title: "文档中心"
  search: true
  categories: true
  tags: true
