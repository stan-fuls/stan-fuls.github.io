<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span><span></span><span></span>
      </label>
      <div class="nav-menu">
        <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">首页</a>
        <a class="nav-link {% if page.url contains '/archive/' %}active{% endif %}" href="{{ '/archive/' | relative_url }}">归档</a>
        <a class="nav-link {% if page.url contains '/docs/' %}active{% endif %}" href="{{ '/docs/' | relative_url }}">文档</a>
        <a class="nav-link {% if page.url contains '/about/' %}active{% endif %}" href="{{ '/about/' | relative_url }}">关于</a>
      </div>
    </nav>
  </div>
</header>
