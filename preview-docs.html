<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文档中心 · 本地预览</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/css/custom.css">
<style>
  body { background: #f5f6fa; }
  .preview-banner {
    background: #fef3c7; border: 1px solid #fbbf24; color: #78350f;
    padding: 10px 18px; font-size: 0.88rem; border-radius: 6px;
    margin: 12px auto; max-width: 900px;
  }
  .preview-banner strong { color: #92400e; }
  .docs-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-top: 18px;
  }
  .docs-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 200px;
    padding: 10px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .docs-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(79, 70, 229, 0.35);
    filter: brightness(1.07);
  }
  .docs-action-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="preview-banner">
  <strong>⏱ 本地预览页：</strong>
  文档存放在本仓库 <code>docs/knowledge-docs/</code> 目录,
  需先运行 <code>node scripts/gen-docs-index.js</code> 生成索引。
</div>

<div class="docs-page">
  <header class="docs-header">
    <h1 class="docs-title">📚 文档中心</h1>
    <p class="docs-subtitle">知识文档阅览，文档存储在 <code>docs/knowledge-docs/</code> 目录</p>
    <div class="docs-actions">
      <a class="docs-action-btn" href="https://raw.githubusercontent.com/stan-fuls/stan-fuls.github.io/master/docs/_templates/document.md" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        下载 Obsidian 文档模板
      </a>
      <a class="docs-action-btn" href="https://github.com/stan-fuls/stan-fuls.github.io/tree/master/docs/knowledge-docs" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        浏览文档目录
      </a>
    </div>
  </header>

  <div class="docs-toolbar">
    <input type="text" id="docs-search-input" class="docs-search-input" placeholder="🔍 搜索文档..." autocomplete="off">
  </div>

  <div id="docs-loading" class="docs-loading">
    <div class="loading-spinner"></div>
    <p>正在加载文档...</p>
  </div>

  <div id="docs-error" class="docs-error" style="display:none;"></div>
  <div id="docs-list" style="display:none;"></div>
</div>

<script>
window.DOCS_REPO_CONFIG = {
  siteBase: ''
};
</script>
<script src="/assets/js/docs.js"></script>

</body>
</html>
